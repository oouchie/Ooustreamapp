<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Cable Killer — 1.91:1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 628px;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 90% at 28% 50%, rgba(255,193,7,0.07) 0%, transparent 65%),
      radial-gradient(ellipse 40% 70% at 72% 50%, rgba(255,193,7,0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.016) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.016) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .divider-line {
    position: absolute;
    left: 50%;
    top: 8%;
    bottom: 8%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(255,193,7,0.12), transparent);
    transform: translateX(-50%);
  }

  /* LEFT PANEL */
  .left-panel {
    position: absolute;
    left: 0;
    top: 0;
    width: 50%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 60px 48px 72px;
    z-index: 1;
  }

  .alert-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .alert-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff3b3b;
    box-shadow: 0 0 10px rgba(255,59,59,0.85);
    animation: pulse-red 1.5s ease-in-out infinite;
  }

  @keyframes pulse-red {
    0%, 100% { box-shadow: 0 0 7px rgba(255,59,59,0.8); }
    50% { box-shadow: 0 0 16px rgba(255,59,59,1); }
  }

  .alert-text {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.38);
  }

  .headline {
    font-size: 60px;
    font-weight: 900;
    line-height: 1.02;
    letter-spacing: -0.03em;
    color: #FFFFFF;
    margin-bottom: 16px;
  }

  .headline .gold {
    color: #FFC107;
    text-shadow: 0 0 40px rgba(255,193,7,0.35);
  }

  .subhead {
    font-size: 17px;
    font-weight: 400;
    color: rgba(255,255,255,0.48);
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .cta-btn {
    background: #FFC107;
    color: #0A0A0A;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 15px 44px;
    border-radius: 40px;
    text-transform: uppercase;
    box-shadow:
      0 0 36px rgba(255,193,7,0.36),
      0 8px 18px rgba(0,0,0,0.5);
  }

  /* RIGHT PANEL */
  .right-panel {
    position: absolute;
    right: 0;
    top: 0;
    width: 50%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 72px 48px 60px;
    gap: 28px;
    z-index: 1;
  }

  .device-section {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .device-glow {
    position: absolute;
    width: 360px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,193,7,0.2) 0%, transparent 70%);
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    filter: blur(10px);
  }

  .stick-body {
    width: 240px;
    height: 50px;
    background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 50%, #242424 100%);
    border-radius: 28px;
    position: relative;
    border: 1.5px solid rgba(255,193,7,0.28);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 8px 30px rgba(0,0,0,0.85),
      0 0 38px rgba(255,193,7,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stick-body::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 18px;
    right: 18px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  }

  .stick-led {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #FFC107;
    box-shadow: 0 0 8px rgba(255,193,7,0.8);
  }

  .stick-logo {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: rgba(255,193,7,0.9);
    text-transform: uppercase;
  }

  .hdmi-plug {
    width: 19px;
    height: 30px;
    background: linear-gradient(135deg, #3a3a3a, #202020);
    border-radius: 2px 2px 5px 5px;
    position: absolute;
    right: -18px;
    top: 50%;
    transform: translateY(-50%);
    border: 1px solid rgba(255,193,7,0.18);
    box-shadow: 0 0 7px rgba(255,193,7,0.1);
  }

  .hdmi-plug::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 3px;
    right: 3px;
    height: 5px;
    background: #1a1a1a;
    border-radius: 0 0 3px 3px;
    border: 1px solid rgba(255,193,7,0.12);
    border-top: none;
  }

  .price-block {
    width: 100%;
    display: flex;
    align-items: stretch;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    overflow: hidden;
  }

  .price-old {
    flex: 1;
    padding: 18px 22px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.07);
  }

  .price-old-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.28);
    margin-bottom: 5px;
  }

  .price-old-amount {
    font-size: 34px;
    font-weight: 900;
    color: rgba(255,80,80,0.7);
    text-decoration: line-through;
    text-decoration-color: rgba(255,80,80,0.38);
    line-height: 1;
  }

  .price-old-period {
    font-size: 11px;
    color: rgba(255,255,255,0.22);
    font-weight: 500;
    margin-top: 4px;
  }

  .price-divider {
    width: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: rgba(255,255,255,0.14);
  }

  .price-new {
    flex: 1;
    padding: 18px 22px;
    text-align: center;
  }

  .price-new-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #FFC107;
    margin-bottom: 5px;
  }

  .price-new-amount {
    font-size: 26px;
    font-weight: 900;
    color: #FFC107;
    text-shadow: 0 0 16px rgba(255,193,7,0.5);
    line-height: 1;
  }

  .price-new-period {
    font-size: 11px;
    color: rgba(255,193,7,0.5);
    font-weight: 500;
    margin-top: 4px;
  }

  .domain {
    position: absolute;
    bottom: 24px;
    right: 72px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.24);
    z-index: 2;
  }

  .domain span { color: rgba(255,193,7,0.38); }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>
  <div class="divider-line"></div>

  <div class="left-panel">
    <div class="alert-label">
      <div class="alert-dot"></div>
      <span class="alert-text">Warning</span>
    </div>

    <h1 class="headline">
      Your cable company<br>
      <span class="gold">doesn't want you</span><br>
      to see this.
    </h1>

    <p class="subhead">One device. Every channel. No monthly bills.</p>

    <div class="cta-btn">Get Ooustream</div>
  </div>

  <div class="right-panel">
    <div class="device-section">
      <div class="device-glow"></div>
      <div class="stick-body">
        <div class="stick-led"></div>
        <span class="stick-logo">Ooustream</span>
        <div class="hdmi-plug"></div>
      </div>
    </div>

    <div class="price-block">
      <div class="price-old">
        <div class="price-old-label">Cable TV</div>
        <div class="price-old-amount">$150</div>
        <div class="price-old-period">per month</div>
      </div>
      <div class="price-divider">→</div>
      <div class="price-new">
        <div class="price-new-label">Ooustream</div>
        <div class="price-new-amount">$20/mo</div>
        <div class="price-new-period">no monthly fees</div>
      </div>
    </div>
  </div>

  <div class="domain"><span>ooustick</span>.com</div>
</body>
</html>
