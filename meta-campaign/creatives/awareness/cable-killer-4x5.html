<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Cable Killer — 4x5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 75% 45% at 50% 58%, rgba(255,193,7,0.08) 0%, transparent 65%),
      radial-gradient(ellipse 50% 25% at 50% 100%, rgba(255,193,7,0.04) 0%, transparent 55%);
    pointer-events: none;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 72px 72px;
    pointer-events: none;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 90px;
    z-index: 1;
  }

  .alert-label {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
  }

  .alert-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #ff3b3b;
    box-shadow: 0 0 12px rgba(255,59,59,0.85);
    animation: pulse-red 1.5s ease-in-out infinite;
  }

  @keyframes pulse-red {
    0%, 100% { box-shadow: 0 0 8px rgba(255,59,59,0.8); }
    50% { box-shadow: 0 0 22px rgba(255,59,59,1); }
  }

  .alert-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }

  .headline {
    text-align: center;
    font-size: 88px;
    font-weight: 900;
    line-height: 1.04;
    letter-spacing: -0.03em;
    color: #FFFFFF;
    margin-bottom: 24px;
  }

  .headline .gold {
    color: #FFC107;
    text-shadow: 0 0 50px rgba(255,193,7,0.35);
  }

  .subhead {
    font-size: 26px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    text-align: center;
    margin-bottom: 70px;
    line-height: 1.5;
  }

  /* Device */
  .device-section {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 70px;
  }

  .device-glow {
    position: absolute;
    width: 480px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,193,7,0.22) 0%, transparent 70%);
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    filter: blur(16px);
  }

  .stick-body {
    width: 300px;
    height: 62px;
    background: linear-gradient(135deg, #2c2c2c 0%, #1a1a1a 50%, #242424 100%);
    border-radius: 34px;
    position: relative;
    border: 1.5px solid rgba(255,193,7,0.28);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 10px 40px rgba(0,0,0,0.85),
      0 0 50px rgba(255,193,7,0.11);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stick-body::before {
    content: '';
    position: absolute;
    top: 7px;
    left: 22px;
    right: 22px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
  }

  .stick-led {
    position: absolute;
    left: 24px;
    top: 50%;
    transform: translateY(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #FFC107;
    box-shadow: 0 0 9px rgba(255,193,7,0.8);
  }

  .stick-logo {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.13em;
    color: rgba(255,193,7,0.9);
    text-transform: uppercase;
  }

  .hdmi-plug {
    width: 24px;
    height: 38px;
    background: linear-gradient(135deg, #3a3a3a, #202020);
    border-radius: 3px 3px 7px 7px;
    position: absolute;
    right: -23px;
    top: 50%;
    transform: translateY(-50%);
    border: 1px solid rgba(255,193,7,0.2);
    box-shadow: 0 0 9px rgba(255,193,7,0.12);
  }

  .hdmi-plug::after {
    content: '';
    position: absolute;
    bottom: -7px;
    left: 4px;
    right: 4px;
    height: 7px;
    background: #1a1a1a;
    border-radius: 0 0 4px 4px;
    border: 1px solid rgba(255,193,7,0.14);
    border-top: none;
  }

  /* Price panel */
  .price-block {
    width: 100%;
    display: flex;
    align-items: stretch;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 56px;
  }

  .price-old {
    flex: 1;
    padding: 32px 36px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.07);
  }

  .price-old-label {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.3);
    margin-bottom: 8px;
  }

  .price-old-amount {
    font-size: 52px;
    font-weight: 900;
    color: rgba(255,80,80,0.75);
    text-decoration: line-through;
    text-decoration-color: rgba(255,80,80,0.4);
    line-height: 1;
  }

  .price-old-period {
    font-size: 15px;
    color: rgba(255,255,255,0.25);
    font-weight: 500;
    margin-top: 6px;
  }

  .price-divider {
    width: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: rgba(255,255,255,0.15);
  }

  .price-new {
    flex: 1;
    padding: 32px 36px;
    text-align: center;
  }

  .price-new-label {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #FFC107;
    margin-bottom: 8px;
  }

  .price-new-amount {
    font-size: 38px;
    font-weight: 900;
    color: #FFC107;
    text-shadow: 0 0 22px rgba(255,193,7,0.5);
    line-height: 1;
  }

  .price-new-period {
    font-size: 15px;
    color: rgba(255,193,7,0.55);
    font-weight: 500;
    margin-top: 6px;
  }

  .cta-btn {
    background: #FFC107;
    color: #0A0A0A;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 24px 72px;
    border-radius: 60px;
    text-transform: uppercase;
    box-shadow:
      0 0 50px rgba(255,193,7,0.38),
      0 10px 28px rgba(0,0,0,0.55);
  }

  .domain {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.28);
    white-space: nowrap;
    z-index: 2;
  }

  .domain span { color: rgba(255,193,7,0.44); }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <div class="container">

    <div class="alert-label">
      <div class="alert-dot"></div>
      <span class="alert-text">Warning</span>
      <div class="alert-dot"></div>
    </div>

    <h1 class="headline">
      Your cable company<br>
      <span class="gold">doesn't want you</span><br>
      to see this.
    </h1>

    <p class="subhead">One device. Every channel. No monthly bills.</p>

    <div class="device-section">
      <div class="device-glow"></div>
      <div class="stick-body">
        <div class="stick-led"></div>
        <span class="stick-logo">Ooustream</span>
        <div class="hdmi-plug"></div>
      </div>
    </div>

    <div class="price-block">
      <div class="price-old">
        <div class="price-old-label">Cable TV</div>
        <div class="price-old-amount">$150</div>
        <div class="price-old-period">per month</div>
      </div>
      <div class="price-divider">→</div>
      <div class="price-new">
        <div class="price-new-label">Ooustream</div>
        <div class="price-new-amount">$20/mo</div>
        <div class="price-new-period">no monthly fees</div>
      </div>
    </div>

    <div class="cta-btn">Get Ooustream</div>

  </div>

  <div class="domain"><span>ooustick</span>.com</div>
</body>
</html>
