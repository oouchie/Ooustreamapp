<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Device Showcase — 1.91:1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 628px;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  .bg-spotlight {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 45% 80% at 50% 72%, rgba(255,193,7,0.1) 0%, rgba(255,193,7,0.03) 40%, transparent 65%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255,193,7,0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  .bg-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 42%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }

  .layout {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 44px 72px;
    z-index: 1;
    gap: 48px;
  }

  /* LEFT */
  .left-col {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
  }

  .overline {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(255,193,7,0.65);
    margin-bottom: 12px;
  }

  .headline {
    font-size: 60px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.035em;
    color: #FFFFFF;
    margin-bottom: 12px;
  }

  .subhead {
    font-size: 17px;
    font-weight: 400;
    color: rgba(255,255,255,0.48);
    margin-bottom: 36px;
  }

  .features-list {
    display: flex;
    flex-direction: column;
    gap: 0;
    width: 100%;
  }

  .feature-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .feature-row:first-child { border-top: 1px solid rgba(255,255,255,0.05); }

  .feature-icon {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: rgba(255,193,7,0.1);
    border: 1px solid rgba(255,193,7,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 12px;
    color: #FFC107;
  }

  .feature-text {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
  }

  /* CENTER */
  .center-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .floor-glow {
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 120px;
    background: radial-gradient(ellipse, rgba(255,193,7,0.18) 0%, transparent 70%);
    filter: blur(18px);
  }

  .floor-reflection {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 380px;
    height: 38px;
    background: radial-gradient(ellipse, rgba(255,193,7,0.12) 0%, transparent 70%);
    filter: blur(7px);
  }

  .device-body {
    width: 400px;
    height: 82px;
    background: linear-gradient(160deg, #303030 0%, #1e1e1e 35%, #161616 65%, #232323 100%);
    border-radius: 44px;
    position: relative;
    border: 1.5px solid rgba(255,193,7,0.22);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.07),
      inset 0 -1px 1px rgba(0,0,0,0.5),
      0 0 0 1px rgba(0,0,0,0.5),
      0 16px 72px rgba(0,0,0,0.95),
      0 0 110px rgba(255,193,7,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .device-body::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 40%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.06), transparent);
    border-radius: 44px 44px 0 0;
  }

  .device-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1;
  }

  .device-led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FFC107;
    box-shadow: 0 0 11px rgba(255,193,7,0.9), 0 0 18px rgba(255,193,7,0.4);
  }

  .device-name {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: rgba(255,193,7,0.88);
    text-transform: uppercase;
  }

  .hdmi-connector {
    position: absolute;
    right: -36px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
  }

  .hdmi-neck {
    width: 36px;
    height: 16px;
    background: linear-gradient(90deg, #2a2a2a, #1e1e1e);
    border-radius: 0 2px 2px 0;
    border: 1px solid rgba(255,193,7,0.12);
    border-left: none;
  }

  .hdmi-head {
    width: 26px;
    height: 22px;
    background: linear-gradient(135deg, #2e2e2e, #1a1a1a);
    border-radius: 2px 4px 4px 2px;
    position: absolute;
    right: -25px;
    top: 50%;
    transform: translateY(-50%);
    border: 1px solid rgba(255,193,7,0.18);
    box-shadow: 0 0 9px rgba(255,193,7,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hdmi-pins {
    width: 16px;
    height: 3px;
    background: repeating-linear-gradient(90deg, rgba(255,193,7,0.4) 0px, rgba(255,193,7,0.4) 2px, transparent 2px, transparent 4px);
  }

  /* RIGHT */
  .right-col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 16px;
  }

  .spec-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    justify-content: flex-end;
  }

  .spec-value {
    font-size: 36px;
    font-weight: 900;
    color: #FFC107;
    letter-spacing: -0.02em;
    line-height: 1;
    text-shadow: 0 0 18px rgba(255,193,7,0.4);
  }

  .spec-label {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
    text-align: right;
    line-height: 1.3;
  }

  .sep-line {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.055);
  }

  .cta-btn {
    background: #FFC107;
    color: #0A0A0A;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 16px 48px;
    border-radius: 40px;
    text-transform: uppercase;
    box-shadow: 0 0 38px rgba(255,193,7,0.38), 0 8px 18px rgba(0,0,0,0.5);
    width: 100%;
    text-align: center;
  }

  .domain {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.22);
    text-align: right;
  }

  .domain span { color: rgba(255,193,7,0.36); }
</style>
</head>
<body>
  <div class="bg-spotlight"></div>
  <div class="bg-vignette"></div>

  <div class="layout">

    <!-- LEFT -->
    <div class="left-col">
      <div class="overline">Introducing</div>
      <h1 class="headline">Your TV just<br>got an upgrade.</h1>
      <p class="subhead">Plug in. Stream everything.</p>
      <div class="features-list">
        <div class="feature-row">
          <div class="feature-icon">&#9654;</div>
          <span class="feature-text">10,000+ Live Channels</span>
        </div>
        <div class="feature-row">
          <div class="feature-icon">&#9744;</div>
          <span class="feature-text">Sports MultiView — 4 screens</span>
        </div>
        <div class="feature-row">
          <div class="feature-icon">&#9675;</div>
          <span class="feature-text">No Monthly Fees Ever</span>
        </div>
      </div>
    </div>

    <!-- CENTER -->
    <div class="center-col">
      <div class="floor-glow"></div>
      <div class="floor-reflection"></div>
      <div class="device-body">
        <div class="device-brand">
          <div class="device-led"></div>
          <span class="device-name">Ooustream</span>
        </div>
        <div class="hdmi-connector">
          <div class="hdmi-neck"></div>
          <div class="hdmi-head"><div class="hdmi-pins"></div></div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right-col">
      <div class="spec-row">
        <div class="spec-label">Live channels<br>worldwide</div>
        <div class="spec-value">10K+</div>
      </div>
      <div class="sep-line"></div>
      <div class="spec-row">
        <div class="spec-label">Monthly fees<br>after purchase</div>
        <div class="spec-value">$0</div>
      </div>
      <div class="sep-line"></div>
      <div class="spec-row">
        <div class="spec-label">Streaming<br>quality</div>
        <div class="spec-value">4K</div>
      </div>
      <div class="sep-line"></div>
      <div class="cta-btn">Shop Ooustream</div>
      <div class="domain"><span>ooustick</span>.com</div>
    </div>

  </div>
</body>
</html>
