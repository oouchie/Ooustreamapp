<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Cable Killer — 9x16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 50% 55%, rgba(255,193,7,0.08) 0%, transparent 65%),
      radial-gradient(ellipse 60% 30% at 50% 100%, rgba(255,193,7,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 50% 20% at 50% 0%, rgba(255,255,255,0.02) 0%, transparent 50%);
    pointer-events: none;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
  }

  /* Safe zone: 14% top and 20% bottom are UI overlay zones on Stories */
  .safe-zone {
    position: absolute;
    top: 14%;
    bottom: 20%;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
    gap: 0;
    z-index: 1;
  }

  /* Horizontal separator lines */
  .rule {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #FFC107, transparent);
    margin-bottom: 48px;
  }

  .alert-label {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 48px;
  }

  .alert-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ff3b3b;
    box-shadow: 0 0 14px rgba(255,59,59,0.9);
    animation: pulse-red 1.5s ease-in-out infinite;
  }

  @keyframes pulse-red {
    0%, 100% { box-shadow: 0 0 10px rgba(255,59,59,0.8); }
    50% { box-shadow: 0 0 24px rgba(255,59,59,1); }
  }

  .alert-text {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }

  .headline {
    text-align: center;
    font-size: 96px;
    font-weight: 900;
    line-height: 1.04;
    letter-spacing: -0.03em;
    color: #FFFFFF;
    margin-bottom: 36px;
  }

  .headline .gold {
    color: #FFC107;
    text-shadow: 0 0 60px rgba(255,193,7,0.4);
  }

  .subhead {
    font-size: 28px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    text-align: center;
    margin-bottom: 80px;
    max-width: 700px;
    line-height: 1.5;
  }

  /* Large device rendering for 9:16 */
  .device-section {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 80px;
  }

  .device-glow-large {
    position: absolute;
    width: 600px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,193,7,0.2) 0%, transparent 70%);
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
    filter: blur(20px);
  }

  .stick-body {
    width: 340px;
    height: 70px;
    background: linear-gradient(135deg, #2e2e2e 0%, #1c1c1c 50%, #262626 100%);
    border-radius: 38px;
    position: relative;
    border: 1.5px solid rgba(255,193,7,0.3);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 12px 48px rgba(0,0,0,0.9),
      0 0 60px rgba(255,193,7,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stick-body::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 24px;
    right: 24px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
  }

  /* LED dot on stick */
  .stick-led {
    position: absolute;
    left: 28px;
    top: 50%;
    transform: translateY(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #FFC107;
    box-shadow: 0 0 8px rgba(255,193,7,0.8);
  }

  .stick-logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.14em;
    color: rgba(255,193,7,0.9);
    text-transform: uppercase;
  }

  .hdmi-plug {
    width: 28px;
    height: 44px;
    background: linear-gradient(135deg, #3e3e3e, #222);
    border-radius: 4px 4px 8px 8px;
    position: absolute;
    right: -27px;
    top: 50%;
    transform: translateY(-50%);
    border: 1px solid rgba(255,193,7,0.2);
    box-shadow: 0 0 10px rgba(255,193,7,0.12);
  }

  .hdmi-plug::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 4px;
    right: 4px;
    height: 8px;
    background: #1c1c1c;
    border-radius: 0 0 5px 5px;
    border: 1px solid rgba(255,193,7,0.15);
    border-top: none;
  }

  /* Shadow reflection below stick */
  .stick-reflection {
    width: 240px;
    height: 20px;
    margin-top: 14px;
    background: linear-gradient(to bottom, rgba(255,193,7,0.08), transparent);
    filter: blur(8px);
    border-radius: 50%;
  }

  /* Price comparison */
  .price-block {
    width: 100%;
    max-width: 820px;
    display: flex;
    align-items: stretch;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 64px;
  }

  .price-old {
    flex: 1;
    padding: 36px 40px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.07);
  }

  .price-old-label {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.3);
    margin-bottom: 10px;
  }

  .price-old-amount {
    font-size: 56px;
    font-weight: 900;
    color: rgba(255,80,80,0.75);
    text-decoration: line-through;
    text-decoration-color: rgba(255,80,80,0.4);
    line-height: 1;
  }

  .price-old-period {
    font-size: 16px;
    color: rgba(255,255,255,0.25);
    font-weight: 500;
    margin-top: 6px;
  }

  .price-divider {
    width: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: rgba(255,255,255,0.15);
    font-weight: 300;
  }

  .price-new {
    flex: 1;
    padding: 36px 40px;
    text-align: center;
  }

  .price-new-label {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #FFC107;
    margin-bottom: 10px;
  }

  .price-new-amount {
    font-size: 42px;
    font-weight: 900;
    color: #FFC107;
    text-shadow: 0 0 24px rgba(255,193,7,0.5);
    line-height: 1;
  }

  .price-new-period {
    font-size: 16px;
    color: rgba(255,193,7,0.55);
    font-weight: 500;
    margin-top: 6px;
  }

  .cta-btn {
    background: #FFC107;
    color: #0A0A0A;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 28px 80px;
    border-radius: 60px;
    text-transform: uppercase;
    box-shadow:
      0 0 60px rgba(255,193,7,0.4),
      0 12px 32px rgba(0,0,0,0.6);
    white-space: nowrap;
  }

  .domain {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.28);
    white-space: nowrap;
    z-index: 2;
  }

  .domain span {
    color: rgba(255,193,7,0.45);
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <div class="safe-zone">
    <div class="rule"></div>

    <div class="alert-label">
      <div class="alert-dot"></div>
      <span class="alert-text">Warning</span>
      <div class="alert-dot"></div>
    </div>

    <h1 class="headline">
      Your cable company<br>
      <span class="gold">doesn't want</span><br>
      you to see this.
    </h1>

    <p class="subhead">One device. Every channel.<br>No monthly bills.</p>

    <div class="device-section">
      <div class="device-glow-large"></div>
      <div class="stick-body">
        <div class="stick-led"></div>
        <span class="stick-logo">Ooustream</span>
        <div class="hdmi-plug"></div>
      </div>
      <div class="stick-reflection"></div>
    </div>

    <div class="price-block">
      <div class="price-old">
        <div class="price-old-label">Cable TV</div>
        <div class="price-old-amount">$150</div>
        <div class="price-old-period">per month</div>
      </div>
      <div class="price-divider">→</div>
      <div class="price-new">
        <div class="price-new-label">Ooustream</div>
        <div class="price-new-amount">$20/mo</div>
        <div class="price-new-period">no monthly fees</div>
      </div>
    </div>

    <div class="cta-btn">Get Ooustream</div>
  </div>

  <div class="domain"><span>ooustick</span>.com</div>
</body>
</html>
