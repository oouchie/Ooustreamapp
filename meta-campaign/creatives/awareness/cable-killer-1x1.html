<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Cable Killer — 1x1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  /* Radial gradient background glow */
  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 65%, rgba(255,193,7,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 90% 40% at 50% 100%, rgba(255,193,7,0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Subtle grid texture */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
    gap: 0;
    z-index: 1;
  }

  /* Alert label */
  .alert-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 36px;
  }

  .alert-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff3b3b;
    box-shadow: 0 0 12px rgba(255,59,59,0.8);
    animation: pulse-red 1.5s ease-in-out infinite;
  }

  @keyframes pulse-red {
    0%, 100% { box-shadow: 0 0 8px rgba(255,59,59,0.8); }
    50% { box-shadow: 0 0 20px rgba(255,59,59,1); }
  }

  .alert-text {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }

  /* Main headline */
  .headline {
    text-align: center;
    font-size: 82px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: #FFFFFF;
    margin-bottom: 20px;
  }

  .headline .gold {
    color: #FFC107;
    display: block;
  }

  .subhead {
    font-size: 24px;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    text-align: center;
    letter-spacing: 0.01em;
    margin-bottom: 64px;
    max-width: 680px;
  }

  /* CSS streaming stick device */
  .device-wrap {
    position: relative;
    margin-bottom: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .device-glow {
    position: absolute;
    width: 380px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,193,7,0.25) 0%, transparent 70%);
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    filter: blur(12px);
  }

  .stick-body {
    width: 260px;
    height: 52px;
    background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 50%, #222 100%);
    border-radius: 30px;
    position: relative;
    border: 1.5px solid rgba(255,193,7,0.25);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 8px 32px rgba(0,0,0,0.8),
      0 0 40px rgba(255,193,7,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stick-body::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 20px;
    right: 20px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  }

  .stick-logo {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: rgba(255,193,7,0.9);
    text-transform: uppercase;
  }

  .hdmi-plug {
    width: 22px;
    height: 34px;
    background: linear-gradient(135deg, #3a3a3a, #1e1e1e);
    border-radius: 3px 3px 6px 6px;
    position: absolute;
    right: -21px;
    top: 50%;
    transform: translateY(-50%);
    border: 1px solid rgba(255,193,7,0.2);
    box-shadow: 0 0 8px rgba(255,193,7,0.15);
  }

  .hdmi-plug::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 3px;
    right: 3px;
    height: 6px;
    background: #1a1a1a;
    border-radius: 0 0 4px 4px;
    border: 1px solid rgba(255,193,7,0.15);
    border-top: none;
  }

  /* Price contrast */
  .price-block {
    display: flex;
    align-items: center;
    gap: 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 56px;
  }

  .price-old {
    padding: 22px 36px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.08);
    position: relative;
  }

  .price-old-label {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.35);
    margin-bottom: 6px;
  }

  .price-old-amount {
    font-size: 40px;
    font-weight: 900;
    color: rgba(255,80,80,0.8);
    text-decoration: line-through;
    text-decoration-color: rgba(255,80,80,0.5);
  }

  .price-old-period {
    font-size: 14px;
    color: rgba(255,255,255,0.3);
    font-weight: 500;
  }

  .price-arrow {
    padding: 0 24px;
    font-size: 28px;
    color: rgba(255,255,255,0.2);
  }

  .price-new {
    padding: 22px 36px;
    text-align: center;
  }

  .price-new-label {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #FFC107;
    margin-bottom: 6px;
  }

  .price-new-amount {
    font-size: 40px;
    font-weight: 900;
    color: #FFC107;
    text-shadow: 0 0 20px rgba(255,193,7,0.5);
  }

  .price-new-period {
    font-size: 14px;
    color: rgba(255,193,7,0.6);
    font-weight: 500;
  }

  /* CTA */
  .cta-btn {
    background: #FFC107;
    color: #0A0A0A;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 20px 64px;
    border-radius: 50px;
    text-transform: uppercase;
    box-shadow:
      0 0 40px rgba(255,193,7,0.35),
      0 8px 24px rgba(0,0,0,0.5);
    margin-bottom: 40px;
  }

  /* Domain */
  .domain {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.3);
    text-transform: lowercase;
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
  }

  .domain span {
    color: rgba(255,193,7,0.5);
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>

  <div class="container">

    <div class="alert-label">
      <div class="alert-dot"></div>
      <span class="alert-text">Warning</span>
      <div class="alert-dot"></div>
    </div>

    <h1 class="headline">
      Your cable company<br>
      <span class="gold">doesn't want you</span><br>
      to see this.
    </h1>

    <p class="subhead">One device. Every channel. No monthly bills.</p>

    <div class="device-wrap">
      <div class="device-glow"></div>
      <div class="stick-body">
        <span class="stick-logo">Ooustream</span>
        <div class="hdmi-plug"></div>
      </div>
    </div>

    <div class="price-block">
      <div class="price-old">
        <div class="price-old-label">Cable TV</div>
        <div class="price-old-amount">$150</div>
        <div class="price-old-period">per month</div>
      </div>
      <div class="price-arrow">→</div>
      <div class="price-new">
        <div class="price-new-label">Ooustream</div>
        <div class="price-new-amount">$20/mo</div>
        <div class="price-new-period">purchase · no fees</div>
      </div>
    </div>

    <div class="cta-btn">Get Ooustream</div>

  </div>

  <div class="domain"><span>ooustick</span>.com</div>
</body>
</html>
