<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Feature Deep Dive — 4x5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #0A0A0A;
  }

  .container {
    width: 1080px;
    height: 1350px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 800px 500px at 50% 675px, rgba(255,193,7,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 400px 300px at 85% 10%, rgba(255,193,7,0.03) 0%, transparent 60%);
    pointer-events: none;
  }

  .corner {
    position: absolute;
    width: 36px;
    height: 36px;
    border-color: rgba(255,193,7,0.4);
    border-style: solid;
  }
  .corner-tl { top: 22px; left: 22px; border-width: 2px 0 0 2px; }
  .corner-tr { top: 22px; right: 22px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 22px; left: 22px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 22px; right: 22px; border-width: 0 2px 2px 0; }

  .outer-border {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(255,193,7,0.15);
    box-shadow: 0 0 60px rgba(255,193,7,0.1), inset 0 0 80px rgba(255,193,7,0.02);
    pointer-events: none;
  }

  /* Header */
  .header {
    width: 100%;
    height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    padding: 0 60px;
    gap: 0;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FFC107;
    box-shadow: 0 0 10px rgba(255,193,7,0.8);
    margin-bottom: 14px;
  }

  .eyebrow {
    font-size: 15px;
    font-weight: 600;
    color: #555;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 10px;
    text-align: center;
  }

  .title {
    font-size: 52px;
    font-weight: 900;
    color: #FFC107;
    letter-spacing: -1.5px;
    line-height: 1.05;
    text-align: center;
  }

  .title-underline {
    width: 110px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #FFC107, transparent);
    border-radius: 2px;
    margin-top: 12px;
    box-shadow: 0 0 14px rgba(255,193,7,0.5);
  }

  /* Grid zone */
  .grid-zone {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 50px;
    position: relative;
    z-index: 2;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: 16px;
    width: 100%;
    height: 100%;
    max-height: 860px;
  }

  .feature-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,193,7,0.1);
    border-radius: 18px;
    padding: 26px 22px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }

  .feature-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,193,7,0.22), transparent);
  }

  .icon-wrap {
    width: 50px;
    height: 50px;
    border-radius: 13px;
    background: rgba(255,193,7,0.1);
    border: 1px solid rgba(255,193,7,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 0 16px rgba(255,193,7,0.09);
  }

  .feature-text {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding-top: 2px;
    min-width: 0;
  }

  .feature-name {
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.3px;
  }

  .feature-desc {
    font-size: 14px;
    font-weight: 400;
    color: #777;
    line-height: 1.3;
  }

  /* Footer */
  .footer {
    width: 100%;
    height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    gap: 12px;
  }

  .divider-line {
    width: 160px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,193,7,0.3), transparent);
    margin-bottom: 2px;
  }

  .footer-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .footer-url {
    font-size: 26px;
    font-weight: 700;
    color: #FFC107;
  }

  .footer-arrow {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,193,7,0.12);
    border: 1.5px solid rgba(255,193,7,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #FFC107;
  }

  .footer-tagline {
    font-size: 15px;
    font-weight: 500;
    color: #444;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="bg-glow"></div>
  <div class="outer-border"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="header">
    <div class="brand-dot"></div>
    <div class="eyebrow">Everything in one device</div>
    <div class="title">What's Inside Ooustream</div>
    <div class="title-underline"></div>
  </div>

  <div class="grid-zone">
    <div class="grid">
      <div class="feature-card">
        <div class="icon-wrap">📺</div>
        <div class="feature-text">
          <div class="feature-name">Live TV</div>
          <div class="feature-desc">Channels streaming 24/7</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="icon-wrap">🎬</div>
        <div class="feature-text">
          <div class="feature-name">Movies</div>
          <div class="feature-desc">Thousands of titles</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="icon-wrap">🎭</div>
        <div class="feature-text">
          <div class="feature-name">Series</div>
          <div class="feature-desc">Binge your favorites</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="icon-wrap">🔍</div>
        <div class="feature-text">
          <div class="feature-name">Smart Search</div>
          <div class="feature-desc">Find anything instantly</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="icon-wrap">🤖</div>
        <div class="feature-text">
          <div class="feature-name">For You</div>
          <div class="feature-desc">AI-powered picks</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="icon-wrap">⊞</div>
        <div class="feature-text">
          <div class="feature-name">MultiView</div>
          <div class="feature-desc">4 screens at once</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="divider-line"></div>
    <div class="footer-tagline">Get yours at</div>
    <div class="footer-row">
      <div class="footer-url">ooustick.com</div>
      <div class="footer-arrow">→</div>
    </div>
  </div>

</div>
</body>
</html>
