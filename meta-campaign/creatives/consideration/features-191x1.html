<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Feature Deep Dive — 1.91:1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 628px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #0A0A0A;
  }

  .container {
    width: 1200px;
    height: 628px;
    display: flex;
    align-items: stretch;
    position: relative;
  }

  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 400px 400px at 240px 314px, rgba(255,193,7,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 700px 400px at 820px 314px, rgba(255,193,7,0.035) 0%, transparent 60%),
      radial-gradient(ellipse 250px 250px at 1150px 100px, rgba(255,193,7,0.03) 0%, transparent 60%);
    pointer-events: none;
  }

  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border-color: rgba(255,193,7,0.4);
    border-style: solid;
  }
  .corner-tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
  .corner-tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

  .outer-border {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(255,193,7,0.15);
    box-shadow: 0 0 60px rgba(255,193,7,0.1), inset 0 0 60px rgba(255,193,7,0.02);
    pointer-events: none;
  }

  /* LEFT PANEL */
  .left-panel {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 36px 28px 36px 40px;
    border-right: 1px solid rgba(255,193,7,0.1);
    position: relative;
    z-index: 2;
  }

  .brand-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FFC107;
    box-shadow: 0 0 10px rgba(255,193,7,0.8);
    margin-bottom: 14px;
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 600;
    color: #555;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 10px;
    line-height: 1.3;
  }

  .title {
    font-size: 30px;
    font-weight: 900;
    color: #FFC107;
    letter-spacing: -1px;
    line-height: 1.1;
    margin-bottom: 12px;
  }

  .title-underline {
    width: 60px;
    height: 2.5px;
    background: linear-gradient(90deg, #FFC107, transparent);
    border-radius: 2px;
    margin-bottom: 24px;
    box-shadow: 0 0 8px rgba(255,193,7,0.4);
  }

  .footer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: auto;
    padding-top: 20px;
  }

  .footer-url {
    font-size: 15px;
    font-weight: 700;
    color: #FFC107;
  }

  .footer-arrow {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255,193,7,0.12);
    border: 1.5px solid rgba(255,193,7,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #FFC107;
  }

  .left-tagline {
    font-size: 12px;
    font-weight: 500;
    color: #444;
    letter-spacing: 0.5px;
  }

  /* RIGHT PANEL: 3x2 grid */
  .right-panel {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 30px 28px 24px;
    position: relative;
    z-index: 2;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    height: 100%;
  }

  .feature-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,193,7,0.1);
    border-radius: 12px;
    padding: 16px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }

  .feature-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,193,7,0.2), transparent);
  }

  .icon-wrap {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(255,193,7,0.1);
    border: 1px solid rgba(255,193,7,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .feature-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .feature-name {
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.2px;
    white-space: nowrap;
  }

  .feature-desc {
    font-size: 11px;
    font-weight: 400;
    color: #666;
    line-height: 1.3;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="container">
  <div class="bg-glow"></div>
  <div class="outer-border"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- LEFT: Brand -->
  <div class="left-panel">
    <div class="brand-dot"></div>
    <div class="eyebrow">Everything in one device</div>
    <div class="title">What's Inside<br>Ooustream</div>
    <div class="title-underline"></div>

    <div class="left-tagline">Get yours at</div>
    <div class="footer-row">
      <div class="footer-url">ooustick.com</div>
      <div class="footer-arrow">→</div>
    </div>
  </div>

  <!-- RIGHT: 3x2 feature grid -->
  <div class="right-panel">
    <div class="grid">
      <div class="feature-card">
        <div class="icon-wrap">📺</div>
        <div class="feature-text">
          <div class="feature-name">Live TV</div>
          <div class="feature-desc">Channels streaming 24/7</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="icon-wrap">🎬</div>
        <div class="feature-text">
          <div class="feature-name">Movies</div>
          <div class="feature-desc">Thousands of titles</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="icon-wrap">🎭</div>
        <div class="feature-text">
          <div class="feature-name">Series</div>
          <div class="feature-desc">Binge your favorites</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="icon-wrap">🔍</div>
        <div class="feature-text">
          <div class="feature-name">Smart Search</div>
          <div class="feature-desc">Find anything instantly</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="icon-wrap">🤖</div>
        <div class="feature-text">
          <div class="feature-name">For You</div>
          <div class="feature-desc">AI-powered picks</div>
        </div>
      </div>

      <div class="feature-card">
        <div class="icon-wrap">⊞</div>
        <div class="feature-text">
          <div class="feature-name">MultiView</div>
          <div class="feature-desc">4 screens at once</div>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
