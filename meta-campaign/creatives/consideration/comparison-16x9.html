<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Cable vs Ooustream — 16x9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: #0A0A0A;
  }

  .container {
    width: 1920px;
    height: 1080px;
    display: flex;
    position: relative;
  }

  /* Background ambient */
  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 700px 700px at 420px 540px, rgba(180,0,0,0.08) 0%, transparent 65%),
      radial-gradient(ellipse 700px 700px at 1500px 540px, rgba(255,193,7,0.06) 0%, transparent 65%),
      radial-gradient(ellipse 300px 300px at 960px 540px, rgba(255,193,7,0.03) 0%, transparent 60%);
    pointer-events: none;
  }

  /* === LEFT COLUMN: Cable === */
  .col-left {
    width: 640px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 48px;
    background: linear-gradient(160deg, #160000 0%, #0A0000 50%, #0A0A0A 100%);
    border-right: 1px solid #2a0000;
    position: relative;
    z-index: 2;
  }

  .col-header-bad {
    font-size: 56px;
    font-weight: 900;
    color: #ff4444;
    letter-spacing: -2px;
    margin-bottom: 6px;
  }

  .col-sub-bad {
    font-size: 13px;
    font-weight: 600;
    color: #662222;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    padding: 16px 20px;
    margin-bottom: 12px;
    border-radius: 12px;
  }

  .row-bad {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .row-good {
    background: rgba(255,193,7,0.05);
    border: 1px solid rgba(255,193,7,0.13);
  }

  .badge {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 900;
  }

  .badge-bad {
    background: rgba(220,30,30,0.18);
    border: 2px solid #cc2222;
    color: #ff4444;
  }

  .badge-good {
    background: rgba(255,193,7,0.15);
    border: 2px solid #FFC107;
    color: #FFC107;
  }

  .row-text-bad {
    font-size: 21px;
    font-weight: 600;
    color: #cc9999;
  }

  .row-text-good {
    font-size: 21px;
    font-weight: 600;
    color: #ffffff;
  }

  /* === CENTER COLUMN: VS + Verdict === */
  .col-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    position: relative;
    z-index: 2;
    gap: 0;
  }

  .vs-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: #0A0A0A;
    border: 3px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 900;
    color: #555;
    margin-bottom: 48px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    letter-spacing: -1px;
  }

  .verdict-block {
    text-align: center;
    margin-bottom: 36px;
  }

  .verdict-line1 {
    font-size: 22px;
    font-weight: 600;
    color: #555;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .verdict-line2 {
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -1px;
    line-height: 1.1;
  }

  .verdict-line2 em {
    color: #FFC107;
    font-style: normal;
  }

  .cta-pill {
    background: #FFC107;
    color: #0A0A0A;
    font-size: 22px;
    font-weight: 900;
    padding: 18px 44px;
    border-radius: 50px;
    letter-spacing: -0.3px;
    box-shadow: 0 0 40px rgba(255,193,7,0.4);
    margin-bottom: 14px;
    text-align: center;
  }

  .url-text {
    font-size: 16px;
    font-weight: 600;
    color: #555;
    letter-spacing: 1px;
    text-align: center;
  }

  .url-text span {
    color: #FFC107;
  }

  /* === RIGHT COLUMN: Ooustream === */
  .col-right {
    width: 640px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 48px;
    background: linear-gradient(200deg, #0A0A0A 0%, #0d0b00 50%, #111000 100%);
    border-left: 1px solid rgba(255,193,7,0.15);
    position: relative;
    z-index: 2;
  }

  .col-right::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,193,7,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  .col-header-good {
    font-size: 56px;
    font-weight: 900;
    color: #FFC107;
    letter-spacing: -2px;
    margin-bottom: 12px;
  }

  .gold-line {
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #FFC107, transparent);
    border-radius: 2px;
    margin-bottom: 36px;
    box-shadow: 0 0 12px rgba(255,193,7,0.6);
  }
</style>
</head>
<body>
<div class="container">
  <div class="bg-glow"></div>

  <!-- LEFT: Cable -->
  <div class="col-left">
    <div class="col-header-bad">Cable</div>
    <div class="col-sub-bad">The old way</div>

    <div class="row row-bad">
      <div class="badge badge-bad">✕</div>
      <div class="row-text-bad">$150+ per month</div>
    </div>
    <div class="row row-bad">
      <div class="badge badge-bad">✕</div>
      <div class="row-text-bad">500 useless channels</div>
    </div>
    <div class="row row-bad">
      <div class="badge badge-bad">✕</div>
      <div class="row-text-bad">Contract required</div>
    </div>
    <div class="row row-bad">
      <div class="badge badge-bad">✕</div>
      <div class="row-text-bad">Ugly cable box</div>
    </div>
    <div class="row row-bad">
      <div class="badge badge-bad">✕</div>
      <div class="row-text-bad">One screen at a time</div>
    </div>
  </div>

  <!-- CENTER: VS + CTA -->
  <div class="col-center">
    <div class="vs-circle">VS</div>

    <div class="verdict-block">
      <div class="verdict-line1">The choice is</div>
      <div class="verdict-line2"><em>obvious.</em></div>
    </div>

    <div class="cta-pill">Get Ooustream Now</div>
    <div class="url-text"><span>ooustick.com</span></div>
  </div>

  <!-- RIGHT: Ooustream -->
  <div class="col-right">
    <div class="col-header-good">Ooustream</div>
    <div class="gold-line"></div>

    <div class="row row-good">
      <div class="badge badge-good">✓</div>
      <div class="row-text-good">$20/mo</div>
    </div>
    <div class="row row-good">
      <div class="badge badge-good">✓</div>
      <div class="row-text-good">Everything you want</div>
    </div>
    <div class="row row-good">
      <div class="badge badge-good">✓</div>
      <div class="row-text-good">No contract ever</div>
    </div>
    <div class="row row-good">
      <div class="badge badge-good">✓</div>
      <div class="row-text-good">Sleek streaming stick</div>
    </div>
    <div class="row row-good">
      <div class="badge badge-good">✓</div>
      <div class="row-text-good">4 screens at once (Pro)</div>
    </div>
  </div>

</div>
</body>
</html>
