<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Ooustream — Cut The Cord (4x5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    color: #ffffff;
    position: relative;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,193,7,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,193,7,0.03) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
  }

  .bg-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      rgba(255, 193, 7, 0.18) 0%,
      rgba(255, 193, 7, 0.08) 35%,
      rgba(255, 193, 7, 0.02) 60%,
      transparent 75%
    );
    pointer-events: none;
  }

  .corner {
    position: absolute;
    width: 36px;
    height: 36px;
    z-index: 20;
  }
  .corner-tl { top: 30px; left: 30px; border-top: 3px solid rgba(255,193,7,0.5); border-left: 3px solid rgba(255,193,7,0.5); }
  .corner-tr { top: 30px; right: 30px; border-top: 3px solid rgba(255,193,7,0.5); border-right: 3px solid rgba(255,193,7,0.5); }
  .corner-bl { bottom: 30px; left: 30px; border-bottom: 3px solid rgba(255,193,7,0.5); border-left: 3px solid rgba(255,193,7,0.5); }
  .corner-br { bottom: 30px; right: 30px; border-bottom: 3px solid rgba(255,193,7,0.5); border-right: 3px solid rgba(255,193,7,0.5); }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 72px 88px;
    gap: 0;
    z-index: 10;
  }

  .badge-free-shipping {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #FFC107, #FFD54F);
    color: #0A0A0A;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 32px;
    border-radius: 100px;
    margin-bottom: 40px;
    box-shadow: 0 0 40px rgba(255,193,7,0.5), 0 4px 20px rgba(0,0,0,0.4);
  }

  .headline {
    font-size: 124px;
    font-weight: 900;
    line-height: 0.9;
    text-align: center;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .headline-top { display: block; color: #ffffff; }
  .headline-bottom {
    display: block;
    color: #FFC107;
    text-shadow: 0 0 80px rgba(255,193,7,0.7), 0 0 160px rgba(255,193,7,0.3);
  }

  .subheadline {
    font-size: 28px;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    text-align: center;
    letter-spacing: 0.04em;
    margin-bottom: 52px;
  }

  /* CSS Device */
  .device-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 52px;
  }

  .device-body {
    width: 280px;
    height: 44px;
    background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 50%, #111 100%);
    border-radius: 24px;
    position: relative;
    border: 1.5px solid rgba(255,193,7,0.28);
    box-shadow: 0 0 50px rgba(255,193,7,0.22), 0 10px 40px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .device-body::before {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #FFC107;
    box-shadow: 0 0 14px rgba(255,193,7,0.9), 0 0 28px rgba(255,193,7,0.5);
  }

  .device-body::after {
    content: '';
    position: absolute;
    top: 7px; left: 44px; right: 44px;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, rgba(255,193,7,0.45), rgba(255,255,255,0.2), rgba(255,193,7,0.45), transparent);
  }

  .device-cable {
    width: 3px; height: 28px;
    background: linear-gradient(180deg, #333, #222);
    border-radius: 0 0 3px 3px;
  }

  .device-shadow {
    width: 210px; height: 14px;
    background: radial-gradient(ellipse, rgba(255,193,7,0.16) 0%, transparent 70%);
    margin-top: 5px;
    filter: blur(4px);
  }

  /* Value props */
  .value-props {
    display: flex;
    gap: 0;
    margin-bottom: 52px;
  }

  .value-prop {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 22px 40px;
    border: 1px solid rgba(255,193,7,0.15);
    background: rgba(255,193,7,0.03);
  }

  .value-prop:first-child { border-radius: 16px 0 0 16px; }
  .value-prop:last-child { border-radius: 0 16px 16px 0; }
  .value-prop + .value-prop { border-left: none; }

  .value-prop-icon { font-size: 34px; line-height: 1; }
  .value-prop-label { font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.85); letter-spacing: 0.02em; }

  /* CTA */
  .cta-button {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, #FFC107 0%, #FFD54F 50%, #FFC107 100%);
    color: #0A0A0A;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 32px 80px;
    border-radius: 100px;
    box-shadow: 0 0 70px rgba(255,193,7,0.45), 0 0 140px rgba(255,193,7,0.2), 0 10px 50px rgba(0,0,0,0.5);
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }

  .cta-button::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
    transform: skewX(-20deg);
  }

  .url-brand {
    font-size: 26px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="container">
    <div class="badge-free-shipping">&#10003;&nbsp; Free Shipping — Limited Time</div>

    <h1 class="headline">
      <span class="headline-top">Cut The</span>
      <span class="headline-bottom">Cord.</span>
    </h1>

    <p class="subheadline">Everything on TV. Nothing you don't need.</p>

    <div class="device-wrapper">
      <div class="device-body"></div>
      <div class="device-cable"></div>
      <div class="device-shadow"></div>
    </div>

    <div class="value-props">
      <div class="value-prop">
        <span class="value-prop-icon">&#128250;</span>
        <span class="value-prop-label">Live TV</span>
      </div>
      <div class="value-prop">
        <span class="value-prop-icon">&#127916;</span>
        <span class="value-prop-label">Movies</span>
      </div>
      <div class="value-prop">
        <span class="value-prop-icon">&#127944;</span>
        <span class="value-prop-label">MultiView</span>
      </div>
    </div>

    <div class="cta-button">
      START FREE TRIAL <span style="font-size:46px;font-weight:900;">&#8594;</span>
    </div>

    <div class="url-brand">ooustick.com</div>
  </div>
</body>
</html>
