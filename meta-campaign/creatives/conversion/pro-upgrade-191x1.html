<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Ooustream — Pro Upgrade (1.91x1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 628px;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    color: #ffffff;
    position: relative;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,193,7,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,193,7,0.025) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
  }

  .bg-glow-left {
    position: absolute;
    top: 50%;
    left: 30%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      rgba(255, 193, 7, 0.14) 0%,
      rgba(255, 193, 7, 0.05) 45%,
      transparent 70%
    );
    pointer-events: none;
  }

  .bg-glow-right {
    position: absolute;
    top: 50%;
    left: 75%;
    transform: translate(-50%, -50%);
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      rgba(255, 193, 7, 0.09) 0%,
      transparent 65%
    );
    pointer-events: none;
  }

  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
    z-index: 2;
  }

  .divider {
    position: absolute;
    top: 40px;
    bottom: 40px;
    left: 52%;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(255,193,7,0.22), rgba(255,193,7,0.22), transparent);
    z-index: 5;
  }

  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    z-index: 20;
  }
  .corner-tl { top: 20px; left: 20px; border-top: 2.5px solid rgba(255,193,7,0.5); border-left: 2.5px solid rgba(255,193,7,0.5); }
  .corner-tr { top: 20px; right: 20px; border-top: 2.5px solid rgba(255,193,7,0.5); border-right: 2.5px solid rgba(255,193,7,0.5); }
  .corner-bl { bottom: 20px; left: 20px; border-bottom: 2.5px solid rgba(255,193,7,0.5); border-left: 2.5px solid rgba(255,193,7,0.5); }
  .corner-br { bottom: 20px; right: 20px; border-bottom: 2.5px solid rgba(255,193,7,0.5); border-right: 2.5px solid rgba(255,193,7,0.5); }

  .layout {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: stretch;
    z-index: 10;
  }

  /* LEFT: text + CTA */
  .left-col {
    flex: 0 0 52%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 56px 48px 70px;
    gap: 0;
  }

  .pro-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #FFC107 0%, #FFD54F 50%, #FFC107 100%);
    color: #0A0A0A;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 7px 20px;
    border-radius: 100px;
    margin-bottom: 18px;
    width: fit-content;
    box-shadow: 0 0 30px rgba(255,193,7,0.6), 0 0 60px rgba(255,193,7,0.25);
    position: relative;
    overflow: hidden;
  }

  .pro-badge::before {
    content: '';
    position: absolute;
    top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
  }

  .headline {
    font-size: 76px;
    font-weight: 900;
    line-height: 0.88;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .headline-line1 { display: block; color: #ffffff; }
  .headline-line2 {
    display: block;
    color: #FFC107;
    text-shadow: 0 0 60px rgba(255,193,7,0.8);
  }

  .subheadline {
    font-size: 20px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    margin-bottom: 26px;
  }

  .subheadline span { color: #FFC107; }

  .feature-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-bottom: 28px;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.65);
  }

  .feature-check {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(255,193,7,0.1);
    border: 1.5px solid rgba(255,193,7,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #FFC107;
    font-size: 10px;
    font-weight: 700;
  }

  .cta-button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, #FFC107 0%, #FFD54F 50%, #FFC107 100%);
    color: #0A0A0A;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 16px 40px;
    border-radius: 100px;
    box-shadow: 0 0 40px rgba(255,193,7,0.45), 0 6px 28px rgba(0,0,0,0.5);
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    width: fit-content;
  }

  .cta-button::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: skewX(-20deg);
  }

  .url-brand {
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.05em;
  }

  /* RIGHT: 2x2 mini grid */
  .right-col {
    flex: 0 0 48%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 60px;
    gap: 0;
  }

  .multiview-grid-wrapper {
    position: relative;
  }

  .multiview-grid-wrapper::before {
    content: '';
    position: absolute;
    inset: -20px;
    border-radius: 20px;
    background: radial-gradient(ellipse at center, rgba(255,193,7,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .multiview-grid-wrapper::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 14px;
    border: 1px solid rgba(255,193,7,0.15);
    pointer-events: none;
  }

  .multiview-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    width: 400px;
    height: 250px;
    position: relative;
    background: rgba(255,193,7,0.03);
    border-radius: 12px;
    padding: 8px;
  }

  .screen {
    border-radius: 7px;
    position: relative;
    overflow: hidden;
    border: 1.5px solid;
  }

  .screen-1 { background: linear-gradient(135deg, #0d1f0d, #071207); border-color: rgba(76,175,80,0.55); box-shadow: 0 0 14px rgba(76,175,80,0.15); }
  .screen-2 { background: linear-gradient(135deg, #0d1520, #070b12); border-color: rgba(33,150,243,0.55); box-shadow: 0 0 14px rgba(33,150,243,0.15); }
  .screen-3 { background: linear-gradient(135deg, #1f0d0d, #120707); border-color: rgba(244,67,54,0.55); box-shadow: 0 0 14px rgba(244,67,54,0.15); }
  .screen-4 { background: linear-gradient(135deg, #1a120d, #100b07); border-color: rgba(255,152,0,0.55); box-shadow: 0 0 14px rgba(255,152,0,0.15); }

  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, transparent 0px, transparent 2px, rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 3px);
    pointer-events: none;
  }

  .screen-badge {
    position: absolute;
    bottom: 5px; left: 5px; right: 5px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(0,0,0,0.65);
    border-radius: 4px;
    padding: 3px 6px;
  }

  .live-dot { width: 5px; height: 5px; border-radius: 50%; background: #f44; box-shadow: 0 0 6px rgba(255,68,68,0.8); flex-shrink: 0; }
  .screen-label { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.8); }

  .audio-badge {
    position: absolute;
    top: 5px; right: 5px;
    background: rgba(255,193,7,0.9);
    color: #0A0A0A;
    font-size: 7px;
    font-weight: 900;
    letter-spacing: 0.06em;
    padding: 2px 5px;
    border-radius: 3px;
  }

  .grid-center-badge {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(10,10,10,0.85);
    border: 2px solid rgba(255,193,7,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    box-shadow: 0 0 16px rgba(255,193,7,0.4);
    backdrop-filter: blur(8px);
  }

  .grid-center-badge span { font-size: 10px; font-weight: 900; color: #FFC107; letter-spacing: 0.1em; }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow-left"></div>
  <div class="bg-glow-right"></div>
  <div class="vignette"></div>
  <div class="divider"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="layout">
    <!-- LEFT COLUMN -->
    <div class="left-col">
      <div class="pro-badge">&#11088; PRO</div>

      <h1 class="headline">
        <span class="headline-line1">Unlock</span>
        <span class="headline-line2">MultiView</span>
      </h1>

      <p class="subheadline"><span>4 Live Streams.</span> One Screen.</p>

      <div class="feature-list">
        <div class="feature-item">
          <div class="feature-check">&#10003;</div>
          <span>Watch 4 live games at once</span>
        </div>
        <div class="feature-item">
          <div class="feature-check">&#10003;</div>
          <span>Switch audio between streams instantly</span>
        </div>
        <div class="feature-item">
          <div class="feature-check">&#10003;</div>
          <span>Quad, Main+3, Dual &amp; Triple layouts</span>
        </div>
      </div>

      <div class="cta-button">
        UPGRADE TO PRO <span style="font-size:24px;font-weight:900;">&#8594;</span>
      </div>

      <div class="url-brand">ooustick.com/subscribe/pro</div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="right-col">
      <div class="multiview-grid-wrapper">
        <div class="multiview-grid">
          <div class="screen screen-1">
            <div class="audio-badge">AUDIO</div>
            <div class="screen-badge"><div class="live-dot"></div><span class="screen-label">ESPN</span></div>
          </div>
          <div class="screen screen-2">
            <div class="screen-badge"><div class="live-dot"></div><span class="screen-label">NFL Network</span></div>
          </div>
          <div class="screen screen-3">
            <div class="screen-badge"><div class="live-dot"></div><span class="screen-label">NBA TV</span></div>
          </div>
          <div class="screen screen-4">
            <div class="screen-badge"><div class="live-dot"></div><span class="screen-label">Fox Sports</span></div>
          </div>
          <div class="grid-center-badge"><span>PRO</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
