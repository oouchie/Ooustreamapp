<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Ooustream — Cut The Cord (1x1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    color: #ffffff;
    position: relative;
  }

  /* Radial gold glow at center */
  .bg-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 820px;
    height: 820px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      rgba(255, 193, 7, 0.18) 0%,
      rgba(255, 193, 7, 0.08) 35%,
      rgba(255, 193, 7, 0.02) 60%,
      transparent 75%
    );
    pointer-events: none;
  }

  /* Secondary glow ring */
  .bg-glow-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1100px;
    height: 1100px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      transparent 40%,
      rgba(255, 193, 7, 0.04) 65%,
      transparent 80%
    );
    pointer-events: none;
  }

  /* Subtle grid texture */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,193,7,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,193,7,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  .container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 80px;
    z-index: 10;
  }

  /* Free Shipping badge */
  .badge-free-shipping {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #FFC107, #FFD54F);
    color: #0A0A0A;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 100px;
    margin-bottom: 36px;
    box-shadow: 0 0 40px rgba(255, 193, 7, 0.5), 0 4px 20px rgba(0,0,0,0.4);
  }

  /* Main headline */
  .headline {
    font-size: 112px;
    font-weight: 900;
    line-height: 0.92;
    text-align: center;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .headline-top {
    display: block;
    color: #ffffff;
  }

  .headline-bottom {
    display: block;
    color: #FFC107;
    text-shadow: 0 0 60px rgba(255, 193, 7, 0.6), 0 0 120px rgba(255, 193, 7, 0.3);
  }

  .subheadline {
    font-size: 28px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.6);
    text-align: center;
    letter-spacing: 0.04em;
    margin-bottom: 52px;
  }

  /* CSS Ooustream device */
  .device-wrapper {
    position: relative;
    margin-bottom: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .device-body {
    width: 260px;
    height: 38px;
    background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 50%, #111111 100%);
    border-radius: 22px;
    position: relative;
    border: 1.5px solid rgba(255, 193, 7, 0.25);
    box-shadow:
      0 0 40px rgba(255, 193, 7, 0.2),
      0 8px 32px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  /* Gold status LED */
  .device-body::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FFC107;
    box-shadow: 0 0 12px rgba(255, 193, 7, 0.9), 0 0 24px rgba(255, 193, 7, 0.5);
  }

  /* Gold reflection line on device */
  .device-body::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 40px;
    right: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,193,7,0.4), rgba(255,255,255,0.2), rgba(255,193,7,0.4), transparent);
    border-radius: 1px;
  }

  /* HDMI cable tail */
  .device-cable {
    width: 3px;
    height: 24px;
    background: linear-gradient(180deg, #333 0%, #222 100%);
    border-radius: 0 0 3px 3px;
    margin-top: 0;
  }

  /* Device reflection */
  .device-reflection {
    width: 240px;
    height: 16px;
    background: linear-gradient(180deg, rgba(255,193,7,0.08), transparent);
    border-radius: 0 0 50% 50%;
    margin-top: 2px;
    filter: blur(4px);
  }

  /* Floor shadow */
  .device-shadow {
    width: 200px;
    height: 12px;
    background: radial-gradient(ellipse, rgba(255,193,7,0.15) 0%, transparent 70%);
    margin-top: 4px;
  }

  /* Value props row */
  .value-props {
    display: flex;
    gap: 0;
    margin-bottom: 56px;
  }

  .value-prop {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 20px 36px;
    border: 1px solid rgba(255, 193, 7, 0.15);
    position: relative;
  }

  .value-prop:first-child {
    border-radius: 16px 0 0 16px;
  }

  .value-prop:last-child {
    border-radius: 0 16px 16px 0;
  }

  .value-prop + .value-prop {
    border-left: none;
  }

  .value-prop-icon {
    font-size: 32px;
    line-height: 1;
  }

  .value-prop-label {
    font-size: 18px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  /* CTA Button */
  .cta-button {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, #FFC107 0%, #FFD54F 50%, #FFC107 100%);
    color: #0A0A0A;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 28px 72px;
    border-radius: 100px;
    box-shadow:
      0 0 60px rgba(255, 193, 7, 0.4),
      0 0 120px rgba(255, 193, 7, 0.2),
      0 8px 40px rgba(0, 0, 0, 0.5);
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }

  .cta-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transform: skewX(-20deg);
  }

  .cta-arrow {
    font-size: 42px;
    font-weight: 900;
    line-height: 1;
  }

  /* URL branding */
  .url-brand {
    font-size: 24px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.08em;
    text-transform: lowercase;
  }

  /* Corner brackets */
  .corner {
    position: absolute;
    width: 32px;
    height: 32px;
    z-index: 20;
  }

  .corner-tl {
    top: 28px; left: 28px;
    border-top: 3px solid rgba(255,193,7,0.5);
    border-left: 3px solid rgba(255,193,7,0.5);
  }

  .corner-tr {
    top: 28px; right: 28px;
    border-top: 3px solid rgba(255,193,7,0.5);
    border-right: 3px solid rgba(255,193,7,0.5);
  }

  .corner-bl {
    bottom: 28px; left: 28px;
    border-bottom: 3px solid rgba(255,193,7,0.5);
    border-left: 3px solid rgba(255,193,7,0.5);
  }

  .corner-br {
    bottom: 28px; right: 28px;
    border-bottom: 3px solid rgba(255,193,7,0.5);
    border-right: 3px solid rgba(255,193,7,0.5);
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow-ring"></div>
  <div class="bg-glow"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="container">
    <div class="badge-free-shipping">
      &#10003;&nbsp; Free Shipping — Limited Time
    </div>

    <h1 class="headline">
      <span class="headline-top">Cut The</span>
      <span class="headline-bottom">Cord.</span>
    </h1>

    <p class="subheadline">Everything on TV. Nothing you don't need.</p>

    <div class="device-wrapper">
      <div class="device-body"></div>
      <div class="device-cable"></div>
      <div class="device-reflection"></div>
      <div class="device-shadow"></div>
    </div>

    <div class="value-props">
      <div class="value-prop">
        <span class="value-prop-icon">&#128250;</span>
        <span class="value-prop-label">Live TV</span>
      </div>
      <div class="value-prop">
        <span class="value-prop-icon">&#127916;</span>
        <span class="value-prop-label">Movies</span>
      </div>
      <div class="value-prop">
        <span class="value-prop-icon">&#127944;</span>
        <span class="value-prop-label">MultiView</span>
      </div>
    </div>

    <div class="cta-button">
      START FREE TRIAL <span class="cta-arrow">&#8594;</span>
    </div>

    <div class="url-brand">ooustick.com</div>
  </div>
</body>
</html>
