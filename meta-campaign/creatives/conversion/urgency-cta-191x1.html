<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Ooustream — Cut The Cord (1.91x1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1200px;
    height: 628px;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Inter', sans-serif;
    color: #ffffff;
    position: relative;
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,193,7,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,193,7,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
  }

  /* Center glow */
  .bg-glow {
    position: absolute;
    top: 50%;
    left: 40%;
    transform: translate(-50%, -50%);
    width: 700px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      rgba(255, 193, 7, 0.18) 0%,
      rgba(255, 193, 7, 0.07) 40%,
      transparent 70%
    );
    pointer-events: none;
  }

  /* Right glow for CTA area */
  .bg-glow-right {
    position: absolute;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center,
      rgba(255, 193, 7, 0.08) 0%,
      transparent 60%
    );
    pointer-events: none;
  }

  /* Vertical separator */
  .divider {
    position: absolute;
    top: 48px;
    bottom: 48px;
    left: 58%;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(255,193,7,0.25), rgba(255,193,7,0.25), transparent);
    z-index: 5;
  }

  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    z-index: 20;
  }
  .corner-tl { top: 20px; left: 20px; border-top: 2.5px solid rgba(255,193,7,0.5); border-left: 2.5px solid rgba(255,193,7,0.5); }
  .corner-tr { top: 20px; right: 20px; border-top: 2.5px solid rgba(255,193,7,0.5); border-right: 2.5px solid rgba(255,193,7,0.5); }
  .corner-bl { bottom: 20px; left: 20px; border-bottom: 2.5px solid rgba(255,193,7,0.5); border-left: 2.5px solid rgba(255,193,7,0.5); }
  .corner-br { bottom: 20px; right: 20px; border-bottom: 2.5px solid rgba(255,193,7,0.5); border-right: 2.5px solid rgba(255,193,7,0.5); }

  .layout {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: stretch;
    z-index: 10;
  }

  /* LEFT: headline + props */
  .left-col {
    flex: 0 0 58%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px 60px 48px 72px;
    gap: 0;
  }

  .badge-free-shipping {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #FFC107, #FFD54F);
    color: #0A0A0A;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 20px;
    border-radius: 100px;
    margin-bottom: 20px;
    width: fit-content;
    box-shadow: 0 0 30px rgba(255,193,7,0.5);
  }

  .headline {
    font-size: 80px;
    font-weight: 900;
    line-height: 0.88;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .headline-top { display: block; color: #ffffff; }
  .headline-bottom {
    display: block;
    color: #FFC107;
    text-shadow: 0 0 60px rgba(255,193,7,0.7);
  }

  .subheadline {
    font-size: 19px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.03em;
    margin-bottom: 28px;
  }

  .value-props {
    display: flex;
    gap: 0;
    width: fit-content;
  }

  .value-prop {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border: 1px solid rgba(255,193,7,0.15);
    background: rgba(255,193,7,0.03);
  }

  .value-prop:first-child { border-radius: 10px 0 0 10px; }
  .value-prop:last-child { border-radius: 0 10px 10px 0; }
  .value-prop + .value-prop { border-left: none; }

  .value-prop-icon { font-size: 20px; line-height: 1; }
  .value-prop-label { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.85); }

  /* RIGHT: device + CTA */
  .right-col {
    flex: 0 0 42%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 60px;
    gap: 0;
  }

  /* CSS Device — compact for banner */
  .device-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 28px;
  }

  .device-body {
    width: 220px;
    height: 32px;
    background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 50%, #111 100%);
    border-radius: 18px;
    position: relative;
    border: 1.5px solid rgba(255,193,7,0.28);
    box-shadow: 0 0 40px rgba(255,193,7,0.22), 0 6px 24px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .device-body::before {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #FFC107;
    box-shadow: 0 0 10px rgba(255,193,7,0.9), 0 0 20px rgba(255,193,7,0.5);
  }

  .device-body::after {
    content: '';
    position: absolute;
    top: 5px; left: 32px; right: 32px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,193,7,0.4), rgba(255,255,255,0.15), rgba(255,193,7,0.4), transparent);
  }

  .device-cable {
    width: 3px; height: 18px;
    background: linear-gradient(180deg, #333, #222);
    border-radius: 0 0 3px 3px;
  }

  .device-shadow {
    width: 150px; height: 10px;
    background: radial-gradient(ellipse, rgba(255,193,7,0.15) 0%, transparent 70%);
    margin-top: 3px;
    filter: blur(3px);
  }

  /* CTA */
  .cta-button {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, #FFC107 0%, #FFD54F 50%, #FFC107 100%);
    color: #0A0A0A;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 20px 50px;
    border-radius: 100px;
    box-shadow: 0 0 50px rgba(255,193,7,0.45), 0 6px 30px rgba(0,0,0,0.5);
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    width: 100%;
    justify-content: center;
    max-width: 380px;
  }

  .cta-button::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
    transform: skewX(-20deg);
  }

  .url-brand {
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.08em;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-glow-right"></div>
  <div class="divider"></div>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="layout">
    <!-- LEFT COLUMN -->
    <div class="left-col">
      <div class="badge-free-shipping">&#10003;&nbsp; Free Shipping — Limited Time</div>

      <h1 class="headline">
        <span class="headline-top">Cut The</span>
        <span class="headline-bottom">Cord.</span>
      </h1>

      <p class="subheadline">Everything on TV. Nothing you don't need.</p>

      <div class="value-props">
        <div class="value-prop">
          <span class="value-prop-icon">&#128250;</span>
          <span class="value-prop-label">Live TV</span>
        </div>
        <div class="value-prop">
          <span class="value-prop-icon">&#127916;</span>
          <span class="value-prop-label">Movies</span>
        </div>
        <div class="value-prop">
          <span class="value-prop-icon">&#127944;</span>
          <span class="value-prop-label">MultiView</span>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="right-col">
      <div class="device-wrapper">
        <div class="device-body"></div>
        <div class="device-cable"></div>
        <div class="device-shadow"></div>
      </div>

      <div class="cta-button">
        START FREE TRIAL <span style="font-size:28px;font-weight:900;">&#8594;</span>
      </div>

      <div class="url-brand">ooustick.com</div>
    </div>
  </div>
</body>
</html>
